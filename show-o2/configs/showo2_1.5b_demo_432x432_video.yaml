wandb:
  entity: null
  # run_id: auto_generated
  resume: 'auto'

experiment:
  project: "demo"
  name: "Showo2_video_generation"
  output_dir: "Showo2_432x432_video"

model:
  weight_type: "bfloat16"  # or "float32" depending on GPU capability
  vae_model:
    type: "wan21"
    pretrained_model_path: "Wan_VAE_model/Wan2.1_VAE.pth"

  # Model checkpoint path (to be specified at runtime)
  model_path: "/home/a6000/bk-project/multimodal-showo/show-o2/1st_show-o2-1.5b-downstream-mixed-modality-432x432/checkpoint-40000/unwrapped_model/pytorch_model.bin"

  showo:
    model_name: "Showo2"
    load_from_showo: False
    pretrained_model_path: "showlab/show-o2-1.5B"
    llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
    llm_vocab_size: null  # will be updated when setting the tokenizer in other code files
    hidden_size: 1536
    image_latent_dim: 16
    image_latent_height: 27
    image_latent_width: 27
    video_latent_height: 27
    video_latent_width: 27
    mixed_modal_latent_height: 27
    mixed_modal_latent_width: 27
    patch_size: 2
    add_time_embeds: True
    num_und_trans_layers: 8
    num_refiner_layers: 10
    clip_latent_dim: 1152
    add_qk_norm: True
    
  clip:
    pretrained_model_path: "google/siglip-so400m-patch14-384"
    gradient_checkpointing: True

dataset:
  params:
    validation_prompts_file: "prompts/video_prompts.txt"
  
  preprocessing:
    max_seq_length: 1024
    resolution: 432  # Video resolution (can be reduced for memory efficiency)
    # Video-specific tokens (5x more than image due to temporal dimension T=5)
    num_t2i_image_tokens: 729
    num_mmu_image_tokens: 729
    num_video_tokens: 3645
    num_mixed_modal_tokens: 729
    # Video-specific latent dimensions
    latent_height: ${model.showo.image_latent_height}
    latent_width: ${model.showo.image_latent_width}
    video_latent_height: ${model.showo.video_latent_height}
    video_latent_width: ${model.showo.video_latent_width}

transport:
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  train_eps: null
  sample_eps: null
  snr_type: "lognorm"
  sampling_method: "euler"  # or "heun" for better quality
  guidance_scale: 5.0
  num_inference_steps: 60 # 20  # Can increase for better quality
  atol: 1e-6
  rtol: 1e-3
  reverse: False
  do_shift: True
  time_shifting_factor: 3.0

# Runtime settings for inference
batch_size: 1  # Keep small for video due to memory requirements
guidance_scale: 5.0  # Can be overridden at runtime
num_inference_steps: 100  # Can be overridden at runtime
fps: 8  # 1초에 8프레임으로 저장