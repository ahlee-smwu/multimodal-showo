mmu_image_path: './docs/mmu/pexels-jane-pham-727419-1571673.jpg'
#mmu_image_path: './docs/mmu/pexels-fotios-photos-2923436.jpg'
#question: 'How to make an avocado milkshake?'
#question: "What can I say to emotionally comfort a friend who just lost their pet?"
question: "A person says that 'You know, I’ve been struggling a lot with my health recently. It feels like every day is a new challenge.' Please say something empathetic in response to this sentence."

wandb:
  entity: null
#  run_id: blvqij6q
  resume: 'auto'

experiment:
    project: "demo"
    name: "Showo2"
    output_dir: "Showo2_432x432_t2i"

model_path: "./2nd_show-o2-1.5b-downstream-mixed-modality-432x432/checkpoint-1000/unwrapped_model/pytorch_model.bin" # pre-trained weight from local

model:
    weight_type: "bfloat16"
    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan_VAE_model/Wan2.1_VAE.pth"

    showo:
        model_name: "Showo2"
#        load_from_showo: True
        load_from_showo: False
        pretrained_model_path: "showlab/show-o2-1.5B" # pre-trained weight from huggingface
        llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
        llm_vocab_size: null # will be updated when setting the tokenizer in other code files
        hidden_size: 1536
        image_latent_dim: 16
        image_latent_height: 27
        image_latent_width: 27
        video_latent_height: 27
        video_latent_width: 27
        patch_size: 2
        add_time_embeds: True
        num_und_trans_layers: 8
        num_refiner_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        clip_pretrained_model_path: "google/siglip-so400m-patch14-384"

dataset:
    params:
        validation_prompts_file: "prompts/t2i_prompts.txt"
    preprocessing:
        max_seq_length: 1024
        resolution: 432
        num_image_tokens: 729
        num_t2i_image_tokens: 729 # org: num_image_tokens
        num_video_tokens: 3645
        latent_height: ${model.showo.image_latent_height}
        latent_width: ${model.showo.image_latent_width}
        video_latent_height: ${model.showo.video_latent_height}
        video_latent_width: ${model.showo.video_latent_width}

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 5.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

